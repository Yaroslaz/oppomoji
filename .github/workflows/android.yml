name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep development signing key for update installs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: oppomoji-development-signing-v1
      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Name APK and record checksum
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/OPPOMoji-0.1.0-alpha.apk
          cd artifacts
          sha256sum OPPOMoji-0.1.0-alpha.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OPPOMoji-apk
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: instrumentation-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/

  android-16:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*apk'
          path: apks
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: |
            adb install -r apks/OPPOMoji-0.1.0-alpha.apk
            adb install -r apks/app-debug-androidTest.apk
            adb shell am instrument -w io.github.yaroslaz.oppomoji.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            python3 -c "assert 'OK (' in open('instrumentation.txt').read(), 'Instrumentation tests failed'"
            adb pull /sdcard/Android/data/io.github.yaroslaz.oppomoji/files/ screenshots
            adb shell settings put system font_scale 1.8
            adb shell am force-stop io.github.yaroslaz.oppomoji
            adb shell am start -W -n io.github.yaroslaz.oppomoji/.MainActivity
            adb shell uiautomator dump /sdcard/oppomoji-ui.xml
            adb pull /sdcard/oppomoji-ui.xml screenshots/large-text-ui.xml
            adb shell screencap -p /sdcard/oppomoji-large.png
            adb pull /sdcard/oppomoji-large.png screenshots/03-large-text.png
            adb logcat -d -s AndroidRuntime:E > android-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-16-verification
          path: |
            instrumentation.txt
            android-runtime.txt
            screenshots/
