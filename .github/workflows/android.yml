name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish APP_VERSION as a pre-release (main only)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_VERSION: 0.1.6-alpha

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent development signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.OPPOMOJI_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          mkdir -p .signing
          printf '%s' "$SIGNING_KEY" | tr -d '\r\n' | base64 --decode > .signing/oppomoji.p12
      - name: Test, lint and build
        env:
          OPPOMOJI_KEYSTORE_PATH: ${{ github.workspace }}/.signing/oppomoji.p12
          OPPOMOJI_KEYSTORE_PASSWORD: ${{ secrets.OPPOMOJI_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Name APK and record checksum
        run: |
          grep -q "versionName '$APP_VERSION'" app/build.gradle
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/OPPOMoji-$APP_VERSION.apk"
          cd artifacts
          sha256sum "OPPOMoji-$APP_VERSION.apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OPPOMoji-apk
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: instrumentation-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/

  android-16:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and audit the pinned full emoji set
        run: |
          python3 -m pip install --disable-pip-version-check fonttools==4.67.0 uharfbuzz==0.57.0 pillow==11.3.0
          python3 tools/prepare_emoji.py --output ci-fonts/verified-emoji.ttf --report ci-fonts/coverage.json
      - uses: actions/download-artifact@v4
        with:
          pattern: '*apk'
          path: apks
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: |
            adb install -r apks/OPPOMoji-${{ env.APP_VERSION }}.apk
            adb install -r apks/app-debug-androidTest.apk
            adb shell mkdir -p /sdcard/Android/data/io.github.yaroslaz.oppomoji/files
            adb push ci-fonts/verified-emoji.ttf /sdcard/Android/data/io.github.yaroslaz.oppomoji/files/verified-emoji.ttf
            adb shell am instrument -w io.github.yaroslaz.oppomoji.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            adb shell rm /sdcard/Android/data/io.github.yaroslaz.oppomoji/files/verified-emoji.ttf
            adb pull /sdcard/Android/data/io.github.yaroslaz.oppomoji/files/ screenshots
            adb logcat -d -s AndroidRuntime:E > android-runtime.txt
            python3 -c "assert 'OK (' in open('instrumentation.txt').read(), 'Instrumentation tests failed'"
            adb shell settings put system font_scale 1.8
            adb shell am force-stop io.github.yaroslaz.oppomoji
            adb shell am start -W -n io.github.yaroslaz.oppomoji/.MainActivity
            adb shell uiautomator dump /sdcard/oppomoji-ui.xml
            adb pull /sdcard/oppomoji-ui.xml screenshots/large-text-ui.xml
            adb shell screencap -p /sdcard/oppomoji-large.png
            adb pull /sdcard/oppomoji-large.png screenshots/03-large-text.png
            adb logcat -d -s AndroidRuntime:E > android-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-16-verification
          path: |
            instrumentation.txt
            android-runtime.txt
            ci-fonts/coverage.json
            screenshots/

  release:
    # A version tag, or a manual run on main with publish, releases only after the emulator checks pass.
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: android-16
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OPPOMoji-apk
          path: artifacts
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "release-notes/$APP_VERSION.md"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "${GITHUB_REF_NAME#v}" = "$APP_VERSION"
            set -- "$GITHUB_REF_NAME" --verify-tag
          else
            # The release creates the version tag on the tested commit.
            set -- "$APP_VERSION" --target "$GITHUB_SHA"
          fi
          gh release create "$@" artifacts/* --prerelease \
            --title "OPPOMoji $APP_VERSION" --notes-file "release-notes/$APP_VERSION.md"
