plugins { id 'com.android.application' }

def developmentKeyPath = System.getenv('OPPOMOJI_KEYSTORE_PATH')
def hasDevelopmentKey = developmentKeyPath != null && new File(developmentKeyPath).isFile()

android {
    namespace 'io.github.yaroslaz.oppomoji'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.yaroslaz.oppomoji'
        minSdk 29
        targetSdk 36
        versionCode 12
        versionName '0.1.11-alpha'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (hasDevelopmentKey) {
            stableDevelopment {
                storeFile file(developmentKeyPath)
                storeType 'PKCS12'
                storePassword System.getenv('OPPOMOJI_KEYSTORE_PASSWORD')?.trim()
                keyAlias 'oppomoji'
                keyPassword System.getenv('OPPOMOJI_KEYSTORE_PASSWORD')?.trim()
            }
        }
    }
    buildTypes {
        debug { if (hasDevelopmentKey) signingConfig signingConfigs.stableDevelopment }
        release {
            minifyEnabled false
            if (hasDevelopmentKey) signingConfig signingConfigs.stableDevelopment
        }
    }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
